<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sheet">
    <header>
      <p class="eyebrow">Task Manager</p>
      <h1>Lo de hoy</h1>
      <p class="tally" id="tally">Sin tareas todavía</p>
    </header>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Escribe una tarea..." autocomplete="off" maxlength="200">
      <button type="submit" id="add-btn">Agregar</button>
    </form>

    <ul id="task-list"></ul>

    <div class="empty-state" id="empty-state">
      <span class="mark">Nada por aquí</span>
      <p>Agrega tu primera tarea arriba para empezar.</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
